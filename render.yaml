services:
  - type: web
    name: civicsolve-sankalp-setu
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: KEYWORD_EMBEDDING_FALLBACK
      - key: TURNSTILE_SECRET_KEY
        value: 1x0000000000000000000000000000000AA